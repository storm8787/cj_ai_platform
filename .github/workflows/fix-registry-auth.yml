name: Fix - Azure GHCR pull auth (credential + single-revision + redeploy)

# 목적: Azure Container App(cj-ai-backend)이 GHCR 이미지를 pull 하지 못해
#   'unauthorized / ImagePullFailure' 로 기동 실패하는 문제를 최종 해결한다.
#
# 확인된 원인 (Azure 시스템 로그):
#   1) GHCR 자격증명 만료/제거 → 인증 pull 불가 (401)
#   2) 앱이 '다중 리비전 모드' 라 트래픽 100% 가 옛 리비전(0000176)에 고정 →
#      존재하지 않는 옛 태그(:7795cb2) 를 계속 pull 시도 → 실패 반복
#
# 조치:
#   1) 유효한 GHCR_TOKEN 으로 레지스트리 자격증명 재등록
#   2) 단일 리비전 모드로 전환 → 최신 리비전에 100% 자동 라우팅 (옛 리비전 비활성)
#   3) 존재하는 최신 이미지(:latest)로 새 리비전 배포
#   4) /api/health 로 기동 확인
#
# 실행: Actions 탭 → 이 워크플로우 → Run workflow. (AZURE_CREDENTIALS, GHCR_TOKEN 사용)

on:
  workflow_dispatch:

env:
  APP_NAME: cj-ai-backend
  RESOURCE_GROUP: rg-cj-ai-platform
  IMAGE: ghcr.io/storm8787/cj-ai-backend:latest

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Re-add ghcr.io pull credential (valid token)
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp registry set \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --server ghcr.io \
              --username "${{ github.actor }}" \
              --password "${{ secrets.GHCR_TOKEN }}"
            echo "✅ 레지스트리 자격증명 재등록 (ghcr.io)"

      - name: Switch to single revision mode (route 100% to latest)
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp revision set-mode \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --mode single
            echo "✅ 단일 리비전 모드 전환 (최신 리비전에 트래픽 100%)"

      - name: Redeploy to :latest (creates fresh active revision)
        uses: azure/CLI@v1
        with:
          inlineScript: |
            echo "새 리비전 배포: $IMAGE"
            az containerapp update \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE"

      - name: Verify revision health & hit /api/health
        uses: azure/CLI@v1
        with:
          inlineScript: |
            echo "===== 조치 후 리비전 상태 ====="
            az containerapp revision list \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" -o table || true
            FQDN=$(az containerapp show \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "===== 앱 FQDN: $FQDN ====="
            echo "===== /api/health 호출 (콜드스타트 대기) ====="
            for i in 1 2 3 4 5 6 7 8; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://$FQDN/api/health" || echo 000)
              echo "시도 $i: HTTP $code"
              if [ "$code" = "200" ]; then echo "🎉 서버 정상 기동!"; break; fi
              sleep 15
            done
