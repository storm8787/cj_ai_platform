name: Fix - Azure GHCR pull auth (re-add credential + redeploy)

# 목적: Azure Container App(cj-ai-backend)이 GHCR 이미지를 pull 할 때
#   'unauthorized / ImagePullFailure' 로 기동 실패하는 문제를 해결한다.
#
# 원인: GHCR 컨테이너 패키지가 익명(anonymous) pull 이 안 되는 상태인데
#   (패키지가 private 이거나 옛 태그가 삭제됨), Azure 에 저장돼 있던
#   GHCR 자격증명이 만료/제거되어 인증 수단이 없어 401 로 거부됨.
#
# 조치: 현재 유효한 GHCR_TOKEN 으로 레지스트리 자격증명을 다시 등록하고,
#   존재하는 최신 이미지(:latest)로 재배포하여 새 리비전이 정상 pull 되게 한다.
#
# 실행: Actions 탭 → 이 워크플로우 선택 → Run workflow (수동).
#   기존 시크릿(AZURE_CREDENTIALS, GHCR_TOKEN)만 사용.

on:
  workflow_dispatch:

env:
  APP_NAME: cj-ai-backend
  RESOURCE_GROUP: rg-cj-ai-platform
  IMAGE: ghcr.io/storm8787/cj-ai-backend:latest

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Re-add ghcr.io pull credential (valid token)
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp registry set \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --server ghcr.io \
              --username "${{ github.actor }}" \
              --password "${{ secrets.GHCR_TOKEN }}"
            echo "레지스트리 자격증명 재등록 완료 (ghcr.io)"

      - name: Redeploy to :latest (existing valid tag)
        uses: azure/CLI@v1
        with:
          inlineScript: |
            echo "새 리비전 배포: $IMAGE"
            az containerapp update \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE"

      - name: Show revision health after fix
        uses: azure/CLI@v1
        with:
          inlineScript: |
            echo "===== 조치 후 리비전 상태 ====="
            az containerapp revision list \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" -o table || true
            echo "===== 앱 FQDN ====="
            az containerapp show \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "properties.configuration.ingress.fqdn" -o tsv || true
