name: Fix - Azure Container App diagnose & recover

# 목적: cj-ai-backend 컨테이너 앱이 안 뜨는 문제를 "진단 + 복구" 한 번에 수행.
#   지금까지 본 ImagePullFailure 는 전부 옛 리비전(0000176, :7795cb2) 것이라,
#   새 리비전(:latest)이 실제로 왜 못 뜨는지(인증 vs 앱 크래시)를 확정해야 한다.
#
# 수행:
#   1) 유효한 GHCR_TOKEN 으로 레지스트리 자격증명 재등록
#   2) 단일 리비전 모드
#   3) :latest 로 재배포 + min-replicas 1 (항상 1개 replica 기동 → 콜드스타트/로그 확보)
#   4) 옛 리비전 0000176 비활성화 (활성 버전 2개 문제 정리)
#   5) 리비전 상태 / 컨테이너 리소스(메모리) 출력
#   6) 최신 리비전의 시스템 로그 + 콘솔 로그 tail 출력  ← 핵심 진단
#   7) /api/health 폴링
#
# 실행: Actions → 이 워크플로우 → Run workflow. (AZURE_CREDENTIALS, GHCR_TOKEN)

on:
  workflow_dispatch:

env:
  APP_NAME: cj-ai-backend
  RESOURCE_GROUP: rg-cj-ai-platform
  IMAGE: ghcr.io/storm8787/cj-ai-backend:latest
  OLD_REVISION: cj-ai-backend--0000176

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Re-add ghcr.io pull credential
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp registry set \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --server ghcr.io --username "${{ github.actor }}" \
              --password "${{ secrets.GHCR_TOKEN }}"
            echo "✅ 자격증명 재등록"

      - name: Single revision mode + deploy :latest + keep 1 replica warm
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp revision set-mode \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --mode single || true
            az containerapp update \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" --min-replicas 1 --max-replicas 3
            echo "✅ :latest 배포 + min-replicas 1"

      - name: Deactivate old revision 0000176 (clean up 2nd active version)
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp revision deactivate \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --revision "$OLD_REVISION" || echo "(이미 비활성/없음)"

      - name: Wait for provisioning
        run: sleep 75

      - name: Revision status & container resources
        uses: azure/CLI@v1
        with:
          inlineScript: |
            echo "===== 리비전 상태 ====="
            az containerapp revision list \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" -o table || true
            echo "===== 컨테이너 리소스(cpu/memory) ====="
            az containerapp show \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "properties.template.containers[].{name:name,cpu:resources.cpu,memory:resources.memory,image:image}" -o json || true

      - name: Latest revision SYSTEM logs (image pull / platform events)
        uses: azure/CLI@v1
        with:
          inlineScript: |
            LATEST=$(az containerapp revision list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "reverse(sort_by([].{n:name,t:properties.createdTime}, &t))[0].n" -o tsv)
            echo "최신 리비전: $LATEST"
            echo "===== SYSTEM 로그 ====="
            az containerapp logs show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --revision "$LATEST" --type system --tail 60 || echo "(system 로그 조회 실패)"

      - name: Latest revision CONSOLE logs (app stdout / crash / OOM)
        uses: azure/CLI@v1
        with:
          inlineScript: |
            LATEST=$(az containerapp revision list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "reverse(sort_by([].{n:name,t:properties.createdTime}, &t))[0].n" -o tsv)
            echo "===== CONSOLE 로그 (앱 stdout) ====="
            az containerapp logs show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --revision "$LATEST" --type console --tail 80 || echo "(console 로그 조회 실패 — replica 미기동 가능)"

      - name: Health check
        uses: azure/CLI@v1
        with:
          inlineScript: |
            FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "FQDN: $FQDN"
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "https://$FQDN/api/health" || echo 000)
              echo "시도 $i: HTTP $code"
              if [ "$code" = "200" ]; then echo "🎉 서버 정상 기동!"; break; fi
              sleep 15
            done
